name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Package Windows .exe (x64)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pyinstaller pywin32

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller sarasota_scraper.spec

      - name: Verify executable build output
        shell: pwsh
        run: |
          if (Test-Path "dist\SarasotaScraper.exe") {
              $size = (Get-Item "dist\SarasotaScraper.exe").Length / 1MB
              Write-Host "Success: dist\SarasotaScraper.exe exists ($('{0:N2}' -f $size) MB)"
          } else {
              Write-Error "Build failed: dist\SarasotaScraper.exe not found!"
              exit 1
          }

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SarasotaScraper-Windows-x64
          path: dist/SarasotaScraper.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SarasotaScraper.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
